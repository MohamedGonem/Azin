name: CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - "**/*.go"
      - "**/*.az"
      - go.mod
      - go.sum
      - .github/workflows/**
  pull_request:
    branches: [ main, dev ]
    paths:
      - "**/*.go"
      - "**/*.az"
      - go.mod
      - go.sum
      - .github/workflows/**
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GOFLAGS: -trimpath

jobs:
  lint:
    name: Lint (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        go: stable

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Verify go.mod/go.sum
        run: |
          go mod tidy
          git diff --exit-code

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "These files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.5.0
          install-mode: binary

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: azc
            race: true
          - os: macos-latest
            binary: azc
            race: false
          - os: windows-latest
            binary: azc.exe
            race: false

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Install GCC 14
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build all packages
        run: go build -v ./...

      - name: Build compiler
        run: go build -v -o "${{ matrix.binary }}" ./cmd/azc

      - name: Verify installation
        run: |
          go install ./cmd/azc
          "$(go env GOPATH)/bin/azc" --help >/dev/null

      - name: Run tests
        if: ${{ !matrix.race }}
        env:
          AZC: ${{ github.workspace }}/${{ matrix.binary }}
        run: |
          go test -v -count=1 -coverprofile=coverage.out -shuffle=on ./...

      - name: Run tests (race)
        if: matrix.race
        env:
          AZC: ${{ github.workspace }}/${{ matrix.binary }}
        run: |
          go test -v -count=1 -race -coverprofile=coverage.out -shuffle=on ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ runner.os }}
          path: coverage.out
          retention-days: 7

      - name: Upload compiler
        uses: actions/upload-artifact@v7
        with:
          name: azc-${{ runner.os }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  cross-compile:
    name: Cross-compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Verify cross compilation
        run: |
          GOOS=linux GOARCH=amd64 go build ./cmd/azc
          GOOS=linux GOARCH=arm64 go build ./cmd/azc
          GOOS=windows GOARCH=amd64 go build ./cmd/azc
          GOOS=windows GOARCH=arm64 go build ./cmd/azc
          GOOS=darwin GOARCH=amd64 go build ./cmd/azc
          GOOS=darwin GOARCH=arm64 go build ./cmd/azc