name: CI

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependencies
        run: go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: azc
          - os: macos-latest
            bin: azc
          - os: windows-latest
            bin: azc.exe

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Install modern GCC (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y -qq gcc-14
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o "${{ matrix.bin }}" ./cmd/azc

      - name: Run tests
        env:
          AZC: ${{ github.workspace }}/${{ matrix.bin }}
        run: go test -v -count=1 -cover ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: azc-${{ runner.os }}
          path: ${{ matrix.bin }}
          retention-days: 7

  docs:
    name: Generate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install doc2go
        run: go install go.abhg.dev/doc2go@latest

      - name: Generate documentation
        run: |
          $(go env GOPATH)/bin/doc2go \
            -internal \
            -out build/docs/html \
            ./...

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: doc2go-html
          path: build/docs/html
          retention-days: 7
