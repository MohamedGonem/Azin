name: Windows

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 10

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Download dependencies
        run: go mod download

      - name: Build binary
        run: go build -v -o azc.exe ./cmd/azc

      - name: Run tests
        env:
          AZC: ${{ github.workspace }}/azc.exe
        run: go test -v -race -count=1 -cover ./...

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: azc-windows
          path: azc.exe
          retention-days: 7
