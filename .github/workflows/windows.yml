name: Windows

on:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main, dev ]
    paths-ignore:
      - '**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Go
    runs-on: windows-latest

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run go vet
        run: go vet ./...

      - name: Build
        shell: pwsh
        run: go build -o azc.exe ./cmd/azc

      - name: Full test suite with coverage
        shell: pwsh
        env:
          AZC: ${{ github.workspace }}/azc.exe
        run: go test -count=1 -cover ./...
